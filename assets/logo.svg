<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular background badge with gradient -->
  <circle cx="100" cy="100" r="92" fill="url(#logoBg)" filter="url(#glow)"/>

  <!-- AI Radar Ring Orbit -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="100" cy="100" r="68" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Stylized Happy Pediatric Tooth -->
  <g transform="translate(45, 42)">
    <!-- Main Tooth Body -->
    <path d="M 25,25 Q 55,8 85,25 Q 110,40 105,75 Q 100,105 88,125 Q 75,130 65,105 Q 55,85 55,85 Q 55,85 45,105 Q 35,130 22,125 Q 10,105 5,75 Q 0,40 25,25 Z" fill="url(#toothGrad)"/>
    
    <!-- Sparkle / Star of Health -->
    <path d="M 85,18 L 88,27 L 97,30 L 88,33 L 85,42 L 82,33 L 73,30 L 82,27 Z" fill="#facc15"/>
    
    <!-- Cute Eyes -->
    <ellipse cx="40" cy="52" rx="4.5" ry="6" fill="#0f172a"/>
    <ellipse cx="70" cy="52" rx="4.5" ry="6" fill="#0f172a"/>
    <!-- Eye Highlights -->
    <circle cx="42" cy="50" r="2" fill="#ffffff"/>
    <circle cx="72" cy="50" r="2" fill="#ffffff"/>

    <!-- Happy Smile -->
    <path d="M 44,66 Q 55,77 66,66" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="32" cy="62" r="5" fill="#f43f5e" opacity="0.35"/>
    <circle cx="78" cy="62" r="5" fill="#f43f5e" opacity="0.35"/>
  </g>

  <!-- AI Nodes / Tech Points -->
  <circle cx="36" cy="70" r="4" fill="#38bdf8"/>
  <circle cx="164" cy="70" r="4" fill="#34d399"/>
  <circle cx="100" cy="180" r="4" fill="#38bdf8"/>
</svg>
