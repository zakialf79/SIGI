<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="oralCavity2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4a151b"/>
      <stop offset="60%" stop-color="#2a0a0d"/>
      <stop offset="100%" stop-color="#140305"/>
    </radialGradient>
    <linearGradient id="gumHealthy2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="100%" stop-color="#d95368"/>
    </linearGradient>
    <linearGradient id="toothWhite2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5ede2"/>
      <stop offset="100%" stop-color="#e2d5c3"/>
    </linearGradient>
    <!-- Plaque gradient -->
    <linearGradient id="plaqueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#oralCavity2)" rx="16"/>

  <!-- Upper Gums -->
  <path d="M 60,130 Q 300,80 540,130 Q 510,195 480,185 Q 420,180 360,180 Q 300,175 240,180 Q 180,180 120,185 Z" fill="url(#gumHealthy2)" opacity="0.95"/>

  <!-- Upper Teeth -->
  <rect x="100" y="160" width="38" height="45" rx="10" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="145" y="155" width="42" height="50" rx="10" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 195,150 Q 215,145 235,150 L 230,210 Q 215,225 200,210 Z" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Central Incisors Upper with early demineralization & cervical plaque -->
  <rect x="242" y="145" width="52" height="70" rx="12" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="304" y="145" width="52" height="70" rx="12" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="2"/>
  
  <path d="M 365,150 Q 385,145 405,150 L 400,210 Q 385,225 370,210 Z" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="413" y="155" width="42" height="50" rx="10" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="462" y="160" width="38" height="45" rx="10" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Plaque Deposits & Early Demineralization / White & Yellow Stains -->
  <!-- Cervical Plaque line on Upper Incisors -->
  <path d="M 243,150 Q 268,162 293,150 Q 290,165 243,165 Z" fill="url(#plaqueGrad)" opacity="0.88"/>
  <path d="M 305,150 Q 330,162 355,150 Q 352,165 305,165 Z" fill="url(#plaqueGrad)" opacity="0.88"/>
  
  <!-- Interdental Early Caries Spot (between 242 and 304) -->
  <ellipse cx="298" cy="180" rx="6" ry="12" fill="#a16207" opacity="0.75"/>
  <ellipse cx="298" cy="180" rx="4" ry="8" fill="#713f12" opacity="0.85"/>

  <!-- White spot lesion (demineralization) on left central -->
  <ellipse cx="265" cy="185" rx="10" ry="7" fill="#ffffff" opacity="0.95" stroke="#fef08a" stroke-width="1.5"/>

  <!-- Lower Gums & Teeth -->
  <path d="M 70,330 Q 300,370 530,330 Q 500,270 450,280 Q 380,285 300,285 Q 220,285 150,280 Z" fill="url(#gumHealthy2)" opacity="0.95"/>

  <rect x="150" y="245" width="36" height="42" rx="8" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="192" y="240" width="38" height="48" rx="8" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="236" y="235" width="40" height="52" rx="9" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="282" y="232" width="42" height="55" rx="9" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="330" y="235" width="40" height="52" rx="9" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="376" y="240" width="38" height="48" rx="8" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="420" y="245" width="36" height="42" rx="8" fill="url(#toothWhite2)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Lower Plaque buildup -->
  <path d="M 237,275 Q 280,272 320,275 Q 320,284 237,284 Z" fill="url(#plaqueGrad)" opacity="0.8"/>

  <!-- Tongue -->
  <path d="M 180,265 Q 300,250 420,265 Q 300,320 180,265 Z" fill="#b83849" opacity="0.85"/>

  <!-- Watermark badge -->
  <g transform="translate(20, 20)">
    <rect width="230" height="32" rx="16" fill="#d97706" opacity="0.9"/>
    <circle cx="16" cy="16" r="6" fill="#fde047"/>
    <text x="32" y="21" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">Kasus 2: Plak & Karies Awal</text>
  </g>
</svg>
